name: MLS scan (manual backup)
# Scans now run on Railway's built-in scheduler every 5 minutes.
# This workflow is manual-only (Actions → Run workflow) as a backup.
on:
  workflow_dispatch: {}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trigger scan
        run: |
          curl -fsS --max-time 90 "${{ secrets.SCAN_URL }}/api/scan" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
